name: quality

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  merge_group:
  workflow_dispatch:
    inputs:
      cloudflare_inventory:
        description: Read existing Cloudflare metadata without mutations
        type: boolean
        default: false
      cloudflare_inventory_sha:
        description: Exact reviewed commit SHA for the read-only inventory
        type: string
        default: ''
      preview_delivery:
        description: Publish reviewed development Preview using preconfigured Base secrets
        type: boolean
        default: false
      shared_preview_migrations:
        description: Apply current trusted-base migrations to preprovisioned shared PR D1; no publication
        type: boolean
        default: false
      preview_quality_run_id:
        description: Exact previously successful development quality run for this SHA
        type: string
        default: ''
      preview_inspection:
        description: Inspect existing development Preview without publication or secret transfer
        type: boolean
        default: false
      inspection_historical_source_sha:
        description: Reviewed historical deployed source SHA (separate from current inspection code)
        type: string
        default: ''
      inspection_preview_id:
        description: Optional reviewed Preview ID (required for static HTTP verification)
        type: string
        default: ''
      inspection_deployment_id:
        description: Exact deployment ID or latest
        type: string
        default: latest
      inspection_immutable_url:
        description: Optional reviewed immutable HTTPS origin for static HTTP checks
        type: string
        default: ''
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ (inputs.preview_delivery || inputs.shared_preview_migrations) && 'delivery' || inputs.preview_inspection && 'inspection' || 'checks' }}
  cancel-in-progress: ${{ !inputs.preview_delivery && !inputs.shared_preview_migrations && !inputs.preview_inspection }}

jobs:
  preview-inspection:
    if: github.event_name == 'workflow_dispatch' && inputs.preview_inspection && !inputs.preview_delivery && !inputs.shared_preview_migrations && github.repository == 'liria24/avatio' && github.ref == 'refs/heads/development' && github.actor == 'liry24' && github.triggering_actor == 'liry24'
    uses: ./.github/workflows/native-inspection.yml
    permissions:
      contents: read
    secrets:
      AVATIO_CF_RESOURCES_JSON: ${{ secrets.AVATIO_CF_RESOURCES_JSON }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    with:
      historical_source_sha: ${{ inputs.inspection_historical_source_sha }}
      preview_id: ${{ inputs.inspection_preview_id }}
      deployment_id: ${{ inputs.inspection_deployment_id }}
      immutable_url: ${{ inputs.inspection_immutable_url }}

  preview-delivery:
    if: github.event_name == 'workflow_dispatch' && (inputs.preview_delivery || inputs.shared_preview_migrations) && !inputs.preview_inspection && !inputs.cloudflare_inventory && github.repository == 'liria24/avatio' && github.ref == 'refs/heads/development' && github.actor == 'liry24' && github.triggering_actor == 'liry24'
    uses: ./.github/workflows/native-delivery.yml
    permissions:
      contents: read
      actions: read
    # Name-scoped forwarding also enables the called job's Environment secret resolution.
    # Do not inherit unrelated repository or production credentials.
    secrets:
      AVATIO_CF_RESOURCES_JSON: ${{ secrets.AVATIO_CF_RESOURCES_JSON }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    with:
      quality_run_id: ${{ inputs.preview_quality_run_id }}
      operation: ${{ inputs.shared_preview_migrations && inputs.preview_delivery && 'ambiguous' || inputs.shared_preview_migrations && 'migrate-shared' || 'deploy' }}

  cloudflare-inventory:
    name: Cloudflare read-only inventory
    if: github.event_name == 'workflow_dispatch' && inputs.cloudflare_inventory && github.repository == 'liria24/avatio' && github.ref == 'refs/heads/development' && github.actor == 'liry24' && github.triggering_actor == 'liry24'
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the exact reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.cloudflare_inventory_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          test "${#EXPECTED_SHA}" -eq 40
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Read only existing account resource metadata
        run: node scripts/cloudflareInventory.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [format, lint, 'lint:unused', typecheck, build]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run ${{ matrix.check }}
        env:
          NITRO_PRESET: ${{ matrix.check == 'build' && 'cloudflare_module' || '' }}
          NODE_OPTIONS: --max-old-space-size=4096

  test-suites:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, nuxt, http, bindings]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run test:${{ matrix.suite }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  browser-smoke:
    name: browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install --with-deps chromium
      - run: vp run test:browser:smoke
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-smoke-diagnostics
          path: |
            .cache/playwright-results
            .cache/playwright-report
          retention-days: 3

  browser-extended:
    name: browser (${{ matrix.project }})
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-extended
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile
            browser: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install --with-deps ${{ matrix.browser }}
      - run: vp exec playwright test --project ${{ matrix.project }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-${{ matrix.project }}-diagnostics
          path: |
            .cache/playwright-results
            .cache/playwright-report
          retention-days: 3

  test:
    name: test
    if: always()
    needs: [test-suites, browser-smoke, browser-extended]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable suite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECT_EXTENDED: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const results = JSON.parse(process.env.RESULTS)
          assert.equal(results['test-suites'].result, 'success', 'Every Vitest suite must succeed')
          assert.equal(results['browser-smoke'].result, 'success', 'Browser smoke must succeed')
          assert.equal(results['browser-extended'].result,
            process.env.EXPECT_EXTENDED === 'true' ? 'success' : 'skipped',
            'Extended browser suites must succeed whenever scheduled')
          JS
