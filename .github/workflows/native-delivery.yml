name: native Preview delivery

on:
  workflow_call:
    inputs:
      quality_run_id:
        type: string
        required: true
      operation:
        type: string
        default: deploy
    secrets:
      AVATIO_CF_RESOURCES_JSON:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
  workflow_run:
    workflows: [quality]
    types: [completed]
  pull_request_target:
    types: [closed]
    branches: [main, development]
  workflow_dispatch:
    inputs:
      quality_run_id:
        description: Exact successful quality run for the current development SHA
        type: string
        required: true

      operation:
        description: Publish development or apply trusted-base shared PR migrations only
        type: choice
        options: [deploy, migrate-shared]
        default: deploy

permissions:
  contents: read
  actions: read

# Shared D1 migration/publication and close/reopen use one non-cancelling lane.
concurrency:
  group: avatio-native-delivery
  cancel-in-progress: false

jobs:
  select:
    if: github.repository == 'liria24/avatio' && (vars.AVATIO_NATIVE_DELIVERY_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/development' && github.actor == 'liry24' && github.triggering_actor == 'liry24'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.select.outputs.action }}
      mode: ${{ steps.select.outputs.mode }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      trusted_sha: ${{ steps.select.outputs.trusted_sha }}
      trusted_ref: ${{ steps.select.outputs.trusted_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - id: select
        run: node scripts/cloudflareNativeCi.ts select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NATIVE_OPERATION: ${{ inputs.operation || 'deploy' }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
          AVATIO_NATIVE_DELIVERY_ENABLED: ${{ vars.AVATIO_NATIVE_DELIVERY_ENABLED }}

  approve:
    needs: select
    if: needs.select.outputs.action == 'deploy' || needs.select.outputs.action == 'migrate-shared'
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.select.outputs.trusted_sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: node scripts/cloudflareNativeCi.ts approve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NATIVE_OPERATION: ${{ inputs.operation || 'deploy' }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
          AVATIO_NATIVE_DELIVERY_ENABLED: ${{ vars.AVATIO_NATIVE_DELIVERY_ENABLED }}
          AVATIO_CF_RESOURCES_JSON: ${{ secrets.AVATIO_CF_RESOURCES_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  build:
    needs: [select, approve]
    if: needs.select.outputs.action == 'deploy'
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.select.outputs.source_sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      # No API token, dotenv key or signing secret reaches source application execution.
      - run: node scripts/cloudflareNativeCi.ts build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NATIVE_OPERATION: ${{ inputs.operation || 'deploy' }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
          AVATIO_NATIVE_DELIVERY_ENABLED: ${{ vars.AVATIO_NATIVE_DELIVERY_ENABLED }}
          AVATIO_CF_RESOURCES_JSON: ${{ secrets.AVATIO_CF_RESOURCES_JSON }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ needs.select.outputs.mode }}-${{ needs.select.outputs.source_sha }}
          path: .cloudflare/native-artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [select, build]
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.select.outputs.trusted_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-${{ needs.select.outputs.mode }}-${{ needs.select.outputs.source_sha }}
          path: .cloudflare/native-incoming
      - name: Publish once and verify the exact immutable version
        run: node scripts/cloudflareNativeCi.ts deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NATIVE_OPERATION: ${{ inputs.operation || 'deploy' }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
          AVATIO_NATIVE_DELIVERY_ENABLED: ${{ vars.AVATIO_NATIVE_DELIVERY_ENABLED }}
          AVATIO_CF_RESOURCES_JSON: ${{ secrets.AVATIO_CF_RESOURCES_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Preserve actual publication identity even after verification failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-publication-${{ needs.select.outputs.source_sha }}
          path: .cloudflare/native-publication.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  cleanup:
    needs: select
    if: needs.select.outputs.action == 'cleanup' && vars.AVATIO_NATIVE_DELIVERY_ENABLED == 'true'
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.select.outputs.trusted_sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      # Delete only the exact closed PR Preview. All preprovisioned data resources survive.
      - run: node scripts/cloudflareNativeCi.ts cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AVATIO_NATIVE_DELIVERY_ENABLED: ${{ vars.AVATIO_NATIVE_DELIVERY_ENABLED }}
          AVATIO_CF_RESOURCES_JSON: ${{ secrets.AVATIO_CF_RESOURCES_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  migrate-shared:
    needs: [select, approve]
    if: needs.select.outputs.action == 'migrate-shared'
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.select.outputs.trusted_sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: node scripts/cloudflareNativeCi.ts migrate-shared
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NATIVE_OPERATION: ${{ inputs.operation || 'deploy' }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
          AVATIO_NATIVE_DELIVERY_ENABLED: ${{ vars.AVATIO_NATIVE_DELIVERY_ENABLED }}
          AVATIO_CF_RESOURCES_JSON: ${{ secrets.AVATIO_CF_RESOURCES_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
