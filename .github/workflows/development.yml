name: development Preview

on:
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  context:
    name: development push context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: false
          run-install: false
      - run: node scripts/cloudflareDevelopment.ts check

  delivery:
    name: development migration and Preview
    needs: context
    if: vars.AVATIO_DEVELOPMENT_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    concurrency:
      # One fixed Preview and reviewed development APP_DB, independent of commit/run.
      group: avatio-development-APP_DB
      cancel-in-progress: false
    env:
      AVATIO_CF_RESOURCES_JSON: ${{ vars.AVATIO_CF_RESOURCES_JSON }}
      AVATIO_NATIVE_DELIVERY_ENABLED: ${{ vars.AVATIO_NATIVE_DELIVERY_ENABLED }}
      AVATIO_DEVELOPMENT_DELIVERY_ENABLED: ${{ vars.AVATIO_DEVELOPMENT_DELIVERY_ENABLED }}
      AVATIO_DEVELOPMENT_PREVIEW_AUTOBUILD_DISABLED: ${{ vars.AVATIO_DEVELOPMENT_PREVIEW_AUTOBUILD_DISABLED }}
      AVATIO_MIGRATION_HISTORY_VERIFIED: ${{ vars.AVATIO_MIGRATION_HISTORY_VERIFIED }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - name: Build the exact development source without deployment credentials
        run: node scripts/cloudflareDevelopment.ts build
      - name: Validate quality and existing target, migrate, then publish and verify
        run: node scripts/cloudflareDevelopment.ts deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Retain actual publication identity even if follow-up verification fails
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: development-publication-${{ github.sha }}-${{ github.run_id }}
          path: .cloudflare/delivery/published.json
          if-no-files-found: ignore
          retention-days: 7
