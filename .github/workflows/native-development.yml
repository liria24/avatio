name: native development delivery

on:
  workflow_run:
    workflows: [quality]
    branches: [development]
    types: [completed]
  workflow_dispatch:
    inputs:
      quality_run_id:
        description: Exact successful push quality run for the current development SHA
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  deliver:
    if: |
      github.repository == 'liria24/avatio' && vars.AVATIO_NATIVE_DELIVERY_ENABLED == 'true'
      && ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/development'
          && github.actor == 'liry24' && github.triggering_actor == 'liry24'))
    uses: ./.github/workflows/native-delivery.yml
    with:
      target: development
      source_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      quality_run_id: ${{ format('{0}', github.event.workflow_run.id || inputs.quality_run_id) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
