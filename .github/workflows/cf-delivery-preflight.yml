name: native delivery preflight

on:
  workflow_run:
    workflows: [quality]
    types: [completed]
  pull_request:
    branches: [main, development]
    types: [closed]
  workflow_dispatch:
    inputs:
      quality_run_id:
        description: Completed successful quality run to inspect (no publishing)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: avatio-native-delivery-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'liria24/avatio' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only source selection. No Cloudflare token, environment, build, artifact or mutation.
      # Privileged publishing/cleanup must remain separate until activation gates are verified.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.workflow_sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Resolve a fresh trusted source; publishing stays disabled
        run: node scripts/cloudflareDeliveryPreflight.ts
        env:
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
