name: cf Nitro compatibility spike

on:
  pull_request:
    branches: [development]
    paths:
      - 'test/fixtures/cf-nitro/**'
      - '.github/workflows/cf-nitro-spike.yml'
      - 'nuxt.config.ts'
      - 'config/cloudflare.ts'
      - 'config/build.ts'
      - 'config/cloudflarePreviewLifecycle.ts'
      - 'config/cloudflareBuildOutput.ts'
      - 'config/cloudflarePublisher.ts'
      - 'config/cloudflareActivation.ts'
      - 'config/cloudflareRecovery.ts'
      - 'scripts/cloudflareNative*.ts'
      - '.github/workflows/native-delivery.yml'
      - 'scripts/cloudflarePreviewSmoke.ts'
      - 'scripts/cloudflareMigrationHistory.ts'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-nitro-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: compatibility (${{ matrix.mode }}, ${{ matrix.nodeCompat }})
    env:
      AVATIO_SPIKE_NODE_COMPAT: ${{ matrix.nodeCompat }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: production
            preview: 'false'
            nodeCompat: v1
          - mode: pr-354
            preview: 'true'
            nodeCompat: v1
          - mode: production
            preview: 'false'
            nodeCompat: v2
          - mode: pr-354
            preview: 'true'
            nodeCompat: v2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Select matching synthetic build and binding context
        env:
          SPIKE_MODE: ${{ matrix.mode }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          import { createCloudflareResourceFixture } from './test/helpers/cloudflareResources.ts'
          const mode = process.env.SPIKE_MODE
          const preview = mode !== 'production'
          const inventory = createCloudflareResourceFixture()
          const target = preview ? inventory.previews[mode] : inventory.production
          const values = {
            STAGE: preview ? 'development' : 'production',
            PREVIEW_NAME: preview ? mode : '',
            PUBLIC_SITE_URL: target.siteUrl,
            R2_PUBLIC_BASE_URL: target.imageBaseUrl,
            OG_IMAGE_ENDPOINT: target.ogImageEndpoint,
          }
          appendFileSync(process.env.GITHUB_ENV,
            Object.entries(values).map(([name, value]) => `${name}=${value}\n`).join(''))
          JS
      - name: Build actual Nuxt/Nitro application
        run: vp run build
        env:
          NITRO_PRESET: cloudflare_module
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Install isolated, pinned official packaging tools
        working-directory: test/fixtures/cf-nitro
        run: bun install --frozen-lockfile
      - name: Reproduce the historical v1 compatibility refusal
        if: matrix.nodeCompat == 'v1'
        working-directory: test/fixtures/cf-nitro
        run: node probe.mjs '${{ matrix.mode }}'
        env:
          CLOUDFLARE_PREVIEW_BUILD: ${{ matrix.preview }}
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Package actual Nitro output with formal v2 settings
        if: matrix.nodeCompat == 'v2'
        working-directory: test/fixtures/cf-nitro
        run: node node_modules/cf/bin/cf build --mode '${{ matrix.mode }}'
        env:
          CLOUDFLARE_PREVIEW_BUILD: ${{ matrix.preview }}
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify complete v2 Build Output, assets and credentialless publisher simulation
        if: matrix.nodeCompat == 'v2'
        working-directory: test/fixtures/cf-nitro
        run: node verify.mjs '${{ matrix.mode }}' '${{ matrix.preview }}'
      - name: Validate production-shaped prebuilt deployment without credentials
        if: matrix.nodeCompat == 'v2' && matrix.mode == 'production'
        working-directory: test/fixtures/cf-nitro
        run: node node_modules/cf/bin/cf deploy --prebuilt --dry-run --mode production
      - name: Rehearse the credentialless native artifact producer and trusted data-only consumer
        if: matrix.nodeCompat == 'v2'
        working-directory: test/fixtures/cf-nitro
        run: node native-delivery.mjs '${{ matrix.mode }}'
      - name: Validate the native production artifact with project-pinned cf on Node
        if: matrix.nodeCompat == 'v2' && matrix.mode == 'production'
        working-directory: .cloudflare/native-artifact
        run: node ../../node_modules/cf/bin/cf deploy --prebuilt --dry-run --mode production
      - name: Execute the v2 application in isolated workerd
        if: matrix.nodeCompat == 'v2'
        working-directory: test/fixtures/cf-nitro
        run: node runtime.mjs '${{ matrix.mode }}'
        env:
          SPIKE_NATIVE_OUTPUT_ROOT: ${{ github.workspace }}/.cloudflare/native-artifact

  migrations:
    name: pinned cf D1 migrations (${{ matrix.cli }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cli: [root, fixture, beta6]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Install isolated candidate CLI
        if: matrix.cli != 'root'
        working-directory: test/fixtures/cf-nitro
        run: bun install --frozen-lockfile
      - name: Verify pinned cf local migrations with synthetic populated data
        env:
          PROBE_CLI: ${{ matrix.cli }}
        run: |
          probe_uid=$(id -u)
          probe_gid=$(id -g)
          probe_node=$(node -p 'process.execPath')
          probe_home="$HOME"
          sudo unshare --net -- sh -c '
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --clear-groups env HOME="$5" "$3" "$4" "$6"
          ' sh "$probe_uid" "$probe_gid" "$probe_node" test/fixtures/cf-nitro/migrations.mjs "$probe_home" "$PROBE_CLI"

  wrangler-migrations:
    name: temporary Wrangler local D1 verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Install isolated, pinned migration tools
        working-directory: test/fixtures/cf-nitro
        run: bun install --frozen-lockfile
      - name: Verify synthetic history, FK preservation, rollback and repeated exit zero
        run: |
          probe_uid=$(id -u)
          probe_gid=$(id -g)
          probe_node=$(node -p 'process.execPath')
          probe_home="$HOME"
          sudo unshare --net -- sh -c '
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --clear-groups env HOME="$5" "$3" "$4" wrangler
          ' sh "$probe_uid" "$probe_gid" "$probe_node" test/fixtures/cf-nitro/migrations.mjs "$probe_home"
